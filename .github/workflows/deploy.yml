name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A deploy that is cancelled halfway through `docker compose up` leaves the
# server on a half-swapped stack, so queue runs instead of cancelling them.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # deploy-type: docker already builds and pushes the image to GHCR before it
  # runs `docker compose pull/up` on the self-hosted runner — do not add a
  # second build-and-push job here or both will race to publish :latest.
  deploy:
    name: Build, push & deploy
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: robticorg/robtic-actions/.github/workflows/deploy.yml@main
    with:
      deploy-type: docker
      runner-labels: '["self-hosted", "robtic-deploy"]'
      environment-name: 'Robtic Server'
      environment-url: 'https://robtic.org'
      server-label: 'core.robtic.org'
      dockerfile: 'Dockerfile'
      image-name: 'ghcr.io/robticorg/robtic-staff'
      compose-project-name: 'robtic-staff'
      compose-file: 'docker-compose.yml'
      compose-env-file: '/home/robtic/robtic-staff/.env'
    secrets:
      DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
