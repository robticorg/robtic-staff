name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queue runs instead of cancelling them, so two pushes can't redeploy the stack at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/robticorg/robtic-staff

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # `:production` is what the robtic-bots Portainer stack runs; `:sha-<commit>` never moves, so a
  # rollback is the Portainer variable STAFF_IMAGE_TAG=sha-<commit>.
  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=robtic-staff
          cache-to: type=gha,mode=max,scope=robtic-staff

  # Portainer re-pulls `:production` and recreates robtic-staff if its image changed. The bot
  # registers its slash commands on startup (unless SKIP_COMMAND_REGISTRATION=true).
  redeploy:
    name: Redeploy robtic-bots
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Call the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.ROBTIC_BOTS_PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::ROBTIC_BOTS_PORTAINER_WEBHOOK_URL is not set — image pushed, nothing redeployed."
            exit 0
          fi
          curl --fail-with-body -sS -X POST --max-time 300 "$WEBHOOK"

  notify:
    name: Deploy notification
    needs: [image, redeploy]
    if: ${{ always() && needs.image.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          RESULT: ${{ needs.redeploy.result == 'success' && 'success' || 'failure' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_DEPLOY is not set — skipping."; exit 0; }
          PAYLOAD=$(jq -n --arg repo "$REPO" --arg sha "${SHA:0:7}" --arg result "$RESULT" --arg url "$RUN_URL" \
            '{username: "Robtic Deploy", embeds: [{title: "\($repo) → robtic-bots: \($result)", url: $url,
              description: "Image `sha-\($sha)` · stack webhook called", color: (if $result == "success" then 3066993 else 15158332 end)}]}')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
