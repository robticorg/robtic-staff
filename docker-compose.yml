services:
  staff-system:
    image: ghcr.io/robticorg/robtic-staff:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /home/robtic/robtic-staff/.env
    environment:
      NODE_ENV: production
    ports:
      # Internal points API (POST /internal/staff/points), open to the internet.
      # Port 8788 (8787 is taken by robtic-guard on the VPS).
      # For VPS-only access use "127.0.0.1:8788:8788" instead.
      - "8788:8788"
    # src/index.ts shuts down on SIGTERM by destroying the gateway client and
    # closing Mongo — both hit the network, so give it more than the 10s default.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
